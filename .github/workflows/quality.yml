name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            physics_server/requirements.txt
      - run: python tools/dev.py setup-dev
      - run: python tools/dev.py lint
      - run: python tools/dev.py test
      - run: python tools/dev.py docs-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore

  godot:
    name: Godot contracts and live startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python tools/dev.py setup
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 -o /tmp/SHA512-SUMS.txt https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/SHA512-SUMS.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          name = 'Godot_v4.7.2-stable_linux.x86_64.zip'
          expected = next(line.split()[0] for line in Path('/tmp/SHA512-SUMS.txt').read_text().splitlines() if line.split()[-1].lstrip('*') == name)
          assert hashlib.sha512(Path('/tmp/godot.zip').read_bytes()).hexdigest() == expected
          PY
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - run: python tools/dev.py godot-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: godot-server-log
          path: physics_server/server.log
          if-no-files-found: ignore
